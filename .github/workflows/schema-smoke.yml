# Real-schema smoke: dump the LIVE public schema, load it into vanilla
# postgres:17, apply any migrations prod hasn't run yet, then execute every
# market RPC as a jwt-authenticated member (supabase/tests/rpc_smoke.sql).
# Catches what the typeless mock e2e cannot: column types, enums, constraints.
# Needs the SUPABASE_DB_URL repo secret (the same pooler connection string
# used for `supabase db push`).
name: Schema smoke
on:
  push:
    paths: ['supabase/**']
  pull_request:
    paths: ['supabase/**']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      LOCAL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: postgresql-client-17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: dump live schema
        run: |
          pg_dump "$SUPABASE_DB_URL" --schema-only --no-owner --no-privileges \
            --schema=public --schema=supabase_migrations -f /tmp/live_schema.sql
          pg_dump "$SUPABASE_DB_URL" --data-only --no-owner \
            --table=project_status --table=project_type --table=resource_type --table=project_role \
            -f /tmp/lookups.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: load into vanilla postgres
        run: |
          psql "$LOCAL" -v ON_ERROR_STOP=1 -f supabase/tests/prelude.sql
          psql "$LOCAL" -f /tmp/live_schema.sql
          psql "$LOCAL" -v ON_ERROR_STOP=1 -f /tmp/lookups.sql
      - name: apply migrations prod has not run yet
        run: |
          for f in supabase/migrations/*.sql; do
            v=$(basename "$f" | cut -d_ -f1)
            if [ "$(psql "$LOCAL" -tAc "select 1 from supabase_migrations.schema_migrations where version='$v'")" != "1" ]; then
              echo "applying NEW migration $f"
              psql "$LOCAL" -v ON_ERROR_STOP=1 -f "$f"
            fi
          done
      - name: RPC smoke as a signed-in member
        run: psql "$LOCAL" -v ON_ERROR_STOP=1 -f supabase/tests/rpc_smoke.sql
